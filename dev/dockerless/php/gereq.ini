; Extra PHP overrides for GEREQ dockerless CLI / built-in server (optional).
; Loaded via: PHP_INI_SCAN_DIR="...:${GEREQ_HOME}/conf" when set by serve scripts.
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
