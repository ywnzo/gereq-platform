# Override: php gereq serve-docker --https
# Publishes HTTPS on host port 443 and mounts self-signed certs.
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./docker/nginx/certs
        target: /etc/nginx/certs
        read_only: true
        consistency: consistent
        bind:
          selinux: z
      - type: bind
        source: ./docker/nginx/https.conf
        target: /etc/nginx/conf.d/https.conf
        read_only: true
        consistency: consistent
        bind:
          selinux: z
