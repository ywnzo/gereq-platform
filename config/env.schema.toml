# GEREQ Platform — environment variable schema
# Source of truth for keys, types, defaults, and docs.
# Runtime values stay in `.env` (KEY=value). This file is catalog only.

# ── App ──────────────────────────────────────────────────────────────────────

[APP_NAME]
type = "string"
default = "GEREQ Platform"
description = "Application display name"

[APP_ENV]
type = "enum"
values = ["local", "production", "testing"]
default = "production"
description = "Runtime environment"

[APP_DEBUG]
type = "bool"
default = false
description = "Debug bar, disables Twig/metadata caches"

[APP_URL]
type = "string"
default = "http://localhost:8080"
description = "Public base URL (trailing slash stripped)"

[APP_URL_PREFIX]
type = "string"
default = ""
description = "Optional URL path prefix when APP_URL path is not enough"

[APP_KEY]
type = "string"
secret = true
required = true
description = "64 hex chars; AES-256-GCM encrypted settings and cookies"

[APP_DEBUG_EDITOR_ROOT]
type = "string"
default = ""
description = "Host project path so debug-bar Twig links open locally from Docker"

[APP_N_PLUS_ONE_THRESHOLD]
type = "int"
default = 2
description = "N+1 detector: min repeated identical SQL (min 2)"

[APP_N_PLUS_ONE_LOG]
type = "bool"
default = true
description = "Log N+1 detections to error_log when APP_DEBUG is true"

[TRUSTED_PROXIES]
type = "string"
default = ""
description = "Comma-separated proxy IPs/CIDRs, or * for private ranges"

# ── Database ─────────────────────────────────────────────────────────────────

[DB_CONNECTION]
type = "enum"
values = ["sqlite", "mysql", "pgsql"]
default = "sqlite"
description = "Database driver (Docker serve-docker uses pgsql)"

[DB_DATABASE]
type = "string"
default = "storage/database.sqlite"
description = "SQLite path (relative to project) or :memory:"

[DB_HOST]
type = "string"
default = "127.0.0.1"
description = "MySQL/Postgres host"

[DB_PORT]
type = "int"
default = 3306
description = "MySQL/Postgres port (pgsql falls back to 5432 when empty)"

[DB_DATABASE_NAME]
type = "string"
default = "gereq"
description = "MySQL/Postgres database name"

[DB_USERNAME]
type = "string"
default = "gereq"
description = "Database username"

[DB_PASSWORD]
type = "string"
secret = true
required = true
default = ""
description = "Database password (required by docker-compose)"

# ── Cache / Redis ────────────────────────────────────────────────────────────

[CACHE_DRIVER]
type = "enum"
values = ["file", "redis", "database", "array"]
default = "file"
description = "Cache backend (database = cache_items table)"

[CACHE_PREFIX]
type = "string"
default = "gereq"
description = "Cache pool namespace"

[CACHE_TTL]
type = "int"
default = 3600
description = "Default cache TTL in seconds"

[CACHE_TWIG]
type = "bool"
default = true
description = "Compile Twig templates to storage/cache/twig (ignored when debug)"

[CACHE_DOCTRINE_RESULT]
type = "bool"
default = true
description = "Doctrine result cache uses the app pool"

[CACHE_MEDIA_TTL]
type = "int"
default = 604800
description = "Browser cache TTL for /media/{id}/file"

[CACHE_DB_TABLE]
type = "string"
default = "cache_items"
description = "Table name when CACHE_DRIVER=database"

[REDIS_HOST]
type = "string"
default = "127.0.0.1"
description = "Redis host (cache + session)"

[REDIS_PORT]
type = "int"
default = 6379
description = "Redis port"

[REDIS_PASSWORD]
type = "string"
secret = true
default = ""
description = "Redis password (empty = none)"

# ── Search ───────────────────────────────────────────────────────────────────

[SEARCH_DRIVER]
type = "enum"
values = ["self_repair"]
default = "self_repair"
description = "Search backend (built-in typo/diacritics LIKE)"

[SEARCH_TYPO_MAX_VARIANTS]
type = "int"
default = 14
description = "Max typo variants per token"

[SEARCH_MIN_TOKEN_LENGTH]
type = "int"
default = 3
description = "Minimum token length for search"

# ── Queue ────────────────────────────────────────────────────────────────────

[QUEUE_DRIVER]
type = "enum"
values = ["sync", "redis", "file"]
default = "sync"
description = "Queue backend"

# ── Files ────────────────────────────────────────────────────────────────────

[FILE_DRIVER]
type = "enum"
values = ["local"]
default = "local"
description = "Upload storage driver"

[FILE_IMAGE_CONVERT]
type = "bool"
default = true
description = "Convert uploads to AVIF/WebP"

[FILE_AVIF_QUALITY]
type = "int"
default = 55
description = "AVIF quality (0–100)"

[FILE_WEBP_QUALITY]
type = "int"
default = 82
description = "WebP quality (0–100)"

[S3_BUCKET]
type = "string"
default = ""
description = "S3 bucket (declared for future use)"

[S3_REGION]
type = "string"
default = "eu-central-1"
description = "S3 region"

[S3_ENDPOINT]
type = "string"
default = ""
description = "Custom S3 endpoint"

[S3_KEY]
type = "string"
secret = true
default = ""
description = "S3 access key"

[S3_SECRET]
type = "string"
secret = true
default = ""
description = "S3 secret key"

# ── Mail ─────────────────────────────────────────────────────────────────────

[MAIL_DSN]
type = "string"
default = "null://null"
description = "Symfony Mailer DSN"

[MAIL_FROM_ADDRESS]
type = "string"
default = "noreply@gereq.cz"
description = "Default From address"

[MAIL_FROM_NAME]
type = "string"
default = "GEREQ Platform"
description = "Default From name"

# ── Session ──────────────────────────────────────────────────────────────────

[SESSION_DRIVER]
type = "enum"
values = ["file", "redis"]
default = "file"
description = "Session store (Docker serve-docker forces redis)"

[SESSION_LIFETIME]
type = "int"
default = 120
description = "Session lifetime in minutes"

[SESSION_SAME_SITE]
type = "enum"
values = ["lax", "strict", "none"]
default = "lax"
description = "Session cookie SameSite"

# ── Admin seed ───────────────────────────────────────────────────────────────

[ADMIN_NAME]
type = "string"
default = "Jiří Novák"
description = "Seeded admin display name"

[ADMIN_EMAIL]
type = "string"
default = "jiri.novak@gereq.cz"
description = "Seeded admin email"

[ADMIN_PASSWORD]
type = "string"
secret = true
required = true
default = "change-me"
description = "Seeded admin password (change after install)"

[ADMIN_ROLE]
type = "string"
default = "superadmin"
description = "Role name assigned to seeded admin"

[DEMO_PROFILE]
type = "enum"
values = ["", "forum", "realityv3"]
default = ""
description = "Demo seed profile (empty = RealEstates default package)"

# ── API / CORS / webhooks ────────────────────────────────────────────────────

[API_PUBLIC_KEY]
type = "string"
secret = true
default = ""
description = "Public storefront API key (grq_pub_*)"

[API_RATE_LIMIT]
type = "int"
default = 600
description = "Authenticated API read rate limit per window"

[API_RATE_LIMIT_WRITE]
type = "int"
default = 120
description = "Authenticated API write rate limit"

[API_RATE_LIMIT_STORE]
type = "int"
default = 60
description = "Store API rate limit"

[API_RATE_LIMIT_PUBLIC]
type = "int"
default = 120
description = "Public API read rate limit (/api/public/*)"

[API_RATE_LIMIT_PUBLIC_WRITE]
type = "int"
default = 30
description = "Public API write rate limit"

[API_PERF_SECRET]
type = "string"
secret = true
default = ""
description = "When set, X-Perf-Secret matching this value skips rate limits"

[WEBHOOKS_ALLOW_PRIVATE_URLS]
type = "bool"
default = false
description = "Allow private webhook targets (SSRF risk — never in production)"

[WEBHOOKS_MAX_FAILURES]
type = "int"
default = 50
description = "Consecutive failures before webhook endpoint auto-disable"

[FRONTEND_ORIGIN]
type = "string"
default = "http://127.0.0.1:5173,http://localhost:5173"
description = "Comma-separated FE origins for public API CORS"

# ── Modules / GitLab ─────────────────────────────────────────────────────────

[GITLAB_URL]
type = "string"
default = "https://git.gereq.cz"
description = "GitLab base URL for module packages"

[GITLAB_GROUP]
type = "string"
default = "gereq"
description = "GitLab group path"

[MODULE_REPO_PREFIX]
type = "string"
default = "module-"
description = "Repo name prefix: {group}/{prefix}{module_id}"

[GITLAB_TOKEN]
type = "string"
secret = true
default = ""
description = "PAT with api / write_repository for modules + grq pr (create MR)"

[CURSOR_API_KEY]
type = "string"
secret = true
default = ""
description = "Optional override for Cursor CLI (agent --api-key). Prefer: agent login"

[MODULE_TAGS_CACHE_TTL]
type = "int"
default = 900
description = "GitLab tags cache TTL in seconds"

# ── WebAuthn ─────────────────────────────────────────────────────────────────

[WEBAUTHN_RP_NAME]
type = "string"
default = ""
description = "Relying party name (falls back to APP_NAME)"

[WEBAUTHN_RP_ID]
type = "string"
default = ""
description = "RP ID hostname only; empty = request host; must not be an IP"

[WEBAUTHN_LOCAL_HOSTNAME]
type = "string"
default = ""
description = "Suggested *.localhost alias for LAN passkey testing"

# ── Money S3 (module fallback) ───────────────────────────────────────────────

[MONEYS3_API_URL]
type = "string"
default = ""
description = "Money S3 API URL fallback when admin settings empty"

[MONEYS3_APP_ID]
type = "string"
default = ""
description = "Money S3 app id"

[MONEYS3_CLIENT_ID]
type = "string"
default = ""
description = "Money S3 client id"

[MONEYS3_CLIENT_SECRET]
type = "string"
secret = true
default = ""
description = "Money S3 client secret"

[MONEYS3_CLIENT_USERNAME]
type = "string"
default = ""
description = "Money S3 client username"

[MONEYS3_CLIENT_PASSWORD]
type = "string"
secret = true
default = ""
description = "Money S3 client password"

# ── Docker / PHP-FPM (compose only) ──────────────────────────────────────────

[GEREQ_PORT]
type = "int"
default = 8080
description = "Host port mapped to nginx (docker-compose)"

[GEREQ_ADMINER_PORT]
type = "int"
default = 8086
description = "Host port for Adminer (--profile tools)"

[PHP_FPM_MAX_CHILDREN]
type = "int"
default = 32
description = "php-fpm pm.max_children"

[PHP_FPM_START_SERVERS]
type = "int"
default = 8
description = "php-fpm pm.start_servers"

[PHP_FPM_MIN_SPARE_SERVERS]
type = "int"
default = 4
description = "php-fpm pm.min_spare_servers"

[PHP_FPM_MAX_SPARE_SERVERS]
type = "int"
default = 16
description = "php-fpm pm.max_spare_servers"

[PHP_FPM_MAX_REQUESTS]
type = "int"
default = 500
description = "php-fpm pm.max_requests"
