name: gereq

# Bind-mount the project with consistency: consistent so Docker Desktop's
# virtualized FS (fakeowner / VirtioFS) reflects host writes immediately.
# Short-form ".:/var/www/html:z" can lag after atomic renames (editor/perl -pi).
x-app-bind: &app-bind
  type: bind
  source: .
  target: /var/www/html
  consistency: consistent
  bind:
    selinux: z

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GEREQ_PORT:-8080}:80"
    volumes:
      - <<: *app-bind
        read_only: true
      - type: bind
        source: ./docker/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        consistency: consistent
        bind:
          selinux: z
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        consistency: consistent
        bind:
          selinux: z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    networks:
      - gereq

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - *app-bind
      - type: bind
        source: ./docker/php/zz-www.conf
        target: /usr/local/etc/php-fpm.d/zz-www.conf
        read_only: true
        consistency: consistent
        bind:
          selinux: z
      - type: bind
        source: ./docker/php/php.ini
        target: /usr/local/etc/php/conf.d/gereq.ini
        read_only: true
        consistency: consistent
        bind:
          selinux: z
    env_file:
      - .env
    environment:
      # APP_URL / FRONTEND_ORIGIN come from .env (not Makefile loopback).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-gereq}
      DB_USERNAME: ${DB_USERNAME:-gereq}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      # PHP-FPM workers (default image had max_children=5)
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-32}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-8}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-4}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-16}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - gereq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_NAME:-gereq}
      POSTGRES_USER: ${DB_USERNAME:-gereq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    # Not published to the host — reach DB only via docker network (or: docker compose exec postgres psql …)
    volumes:
      - gereq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gereq} -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - gereq

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gereq-redis:/data
    networks:
      - gereq

  # Opt-in only: docker compose --profile tools up adminer
  adminer:
    profiles: ["tools"]
    image: adminer:4
    ports:
      - "${GEREQ_ADMINER_PORT:-8086}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
      ADMINER_SERVER: postgres
      ADMINER_USERNAME: ${DB_USERNAME:-gereq}
      ADMINER_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      ADMINER_DB: ${DB_DATABASE_NAME:-gereq}
    volumes:
      - type: bind
        source: ./docker/adminer/autologin.php
        target: /var/www/html/plugins-enabled/autologin.php
        read_only: true
        consistency: consistent
        bind:
          selinux: z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gereq

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "gereq", "queue:work"]
    volumes:
      - *app-bind
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-gereq}
      DB_USERNAME: ${DB_USERNAME:-gereq}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - gereq
    restart: unless-stopped

  # Fires due Schedule entries once a minute; async tasks are dispatched to Redis
  # and processed by the queue worker.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["sh", "-c", "while true; do php gereq schedule:run; sleep 60; done"]
    volumes:
      - *app-bind
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-gereq}
      DB_USERNAME: ${DB_USERNAME:-gereq}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      php:
        condition: service_started
      queue:
        condition: service_started
    networks:
      - gereq
    restart: unless-stopped

networks:
  gereq:
    driver: bridge

volumes:
  gereq-redis:
  gereq-postgres:
