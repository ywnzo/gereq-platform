name: gereq

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GEREQ_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    networks:
      - gereq

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html:z
      - ./docker/php/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro,z
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      # storefront CORS (optional). Admin assets are served from /build via Bun.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:5173,http://localhost:5173}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-gereq}
      DB_USERNAME: ${DB_USERNAME:-gereq}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      # PHP-FPM workers (default image had max_children=5)
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-32}
      PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-8}
      PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-4}
      PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-16}
      PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - gereq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_NAME:-gereq}
      POSTGRES_USER: ${DB_USERNAME:-gereq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    # Not published to the host — reach DB only via docker network (or: docker compose exec postgres psql …)
    volumes:
      - gereq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gereq} -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - gereq

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - gereq-redis:/data
    networks:
      - gereq

  # Opt-in only: docker compose --profile tools up adminer
  adminer:
    profiles: ["tools"]
    image: adminer:4
    ports:
      - "${GEREQ_ADMINER_PORT:-8086}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
      ADMINER_SERVER: postgres
      ADMINER_USERNAME: ${DB_USERNAME:-gereq}
      ADMINER_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      ADMINER_DB: ${DB_DATABASE_NAME:-gereq}
    volumes:
      - ./docker/adminer/autologin.php:/var/www/html/plugins-enabled/autologin.php:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gereq

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "gereq", "queue:work"]
    volumes:
      - .:/var/www/html:z
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-gereq}
      DB_USERNAME: ${DB_USERNAME:-gereq}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - gereq
    restart: unless-stopped

networks:
  gereq:
    driver: bridge

volumes:
  gereq-redis:
  gereq-postgres:
