# GEREQ Platform — testing engine (php bin/gereq-test)
#
# Jobs:
#   test:modules         — every modules/*/Tests (+ ModuleStructure)
#   test:core            — platform unit tests (tests/Unit except Modules/)
#   test:core-modules    — core then modules in one job
#   test:query-hygiene   — N+1 / query-budget assertions (core + modules)
#   analyse:phpstan        — PHPStan level 5 (src + modules + tests, baseline)
#   analyse:phpstan-tests  — PHPStan level 6 + strict-rules (src/Testing + tests)
#   analyse:cs             — PSR-12 + strict_types (src + modules + tests)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - analyse

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Relative ../module-*.git URLs inherit CI_REPOSITORY_URL (reachable from the job).
  # Absolute https://git.gereq.cz often fails here (Docker cannot hairpin :443).
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

default:
  image: php:8.4-cli-bookworm
  interruptible: true
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache/
      - vendor/
    policy: pull-push

.composer_setup:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git unzip libzip-dev libsqlite3-dev $PHPIZE_DEPS
    - docker-php-ext-install -j$(nproc) zip pdo_sqlite
    - |
      if ! command -v composer >/dev/null 2>&1; then
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      fi
    # Unit tests are DB-free (sqlite :memory:); redis/gd not needed for these targets.
    - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-redis --ignore-platform-req=ext-gd

.test_job:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test "$TEST_TARGET"

test:modules:
  extends: .test_job
  variables:
    TEST_TARGET: modules

test:core:
  extends: .test_job
  variables:
    TEST_TARGET: core

# Combined gate: core + all modules (two engine invocations, one CI job).
test:core-modules:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test core
    - php bin/gereq-test modules

# N+1 detector + QueryAssertions (core Debug tests + ModuleStructure QueryHygiene).
test:query-hygiene:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test core --filter='NPlusOne|QueryCollector|QueryHygiene'
    - php bin/gereq-test modules --filter='QueryHygiene|NPlusOne'

analyse:phpstan:
  extends: .composer_setup
  stage: analyse
  script:
    - composer phpstan

analyse:phpstan-tests:
  extends: .composer_setup
  stage: analyse
  script:
    - composer phpstan:tests

analyse:cs:
  extends: .composer_setup
  stage: analyse
  script:
    - composer cs
