# GEREQ Platform — testing engine (php bin/gereq-test)
#
# Jobs:
#   test:modules         — every modules/*/Tests (+ ModuleStructure)
#   test:core            — platform unit tests (tests/Unit except Modules/)
#   test:core-modules    — core then modules in one job
#   test:query-hygiene   — N+1 / query-budget assertions (core + modules)
#   analyse:phpstan        — PHPStan level 5 (src + modules + tests, baseline)
#   analyse:phpstan-tests  — PHPStan level 6 + strict-rules (src/Testing + tests)
#   analyse:cs             — PSR-12 + strict_types (src + modules + tests)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - analyse

variables:
  # Helper image has no ssh(1); clone submodules in the job after loading SSH_PRIVATE_KEY.
  GIT_SUBMODULE_STRATEGY: none
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  # Internal GitLab SSH host on the runner Docker network (clone_url uses http://gitlab/...).
  CI_SSH_HOST: gitlab

default:
  image: php:8.4-cli-bookworm
  interruptible: true
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache/
      - vendor/
    policy: pull-push

.composer_setup:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git openssh-client unzip libzip-dev libsqlite3-dev $PHPIZE_DEPS
    - docker-php-ext-install -j$(nproc) zip pdo_sqlite
    - |
      if ! command -v composer >/dev/null 2>&1; then
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      fi
    # SSH deploy key for private module submodules (see CI variable SSH_PRIVATE_KEY).
    - |
      set -e
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY CI variable is required to clone module submodules over SSH." >&2
        exit 1
      fi
      eval "$(ssh-agent -s)"
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        chmod 400 "$SSH_PRIVATE_KEY"
        ssh-add "$SSH_PRIVATE_KEY"
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      fi
      {
        echo "Host git.gereq.cz"
        echo "  HostName ${CI_SSH_HOST}"
        echo "  User git"
        echo "  StrictHostKeyChecking accept-new"
        echo "Host ${CI_SSH_HOST}"
        echo "  StrictHostKeyChecking accept-new"
      } > ~/.ssh/config
      chmod 600 ~/.ssh/config
      ssh-keyscan -H "${CI_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
      git submodule sync --recursive
      git submodule update --init --recursive --depth 20
    # Unit tests are DB-free (sqlite :memory:); redis/gd not needed for these targets.
    - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-redis --ignore-platform-req=ext-gd

.test_job:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test "$TEST_TARGET"

test:modules:
  extends: .test_job
  variables:
    TEST_TARGET: modules

test:core:
  extends: .test_job
  variables:
    TEST_TARGET: core

# Combined gate: core + all modules (two engine invocations, one CI job).
test:core-modules:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test core
    - php bin/gereq-test modules

# N+1 detector + QueryAssertions (core Debug tests + ModuleStructure QueryHygiene).
test:query-hygiene:
  extends: .composer_setup
  stage: test
  script:
    - php bin/gereq-test core --filter='NPlusOne|QueryCollector|QueryHygiene'
    - php bin/gereq-test modules --filter='QueryHygiene|NPlusOne'

analyse:phpstan:
  extends: .composer_setup
  stage: analyse
  script:
    - composer phpstan

analyse:phpstan-tests:
  extends: .composer_setup
  stage: analyse
  script:
    - composer phpstan:tests

analyse:cs:
  extends: .composer_setup
  stage: analyse
  script:
    - composer cs
