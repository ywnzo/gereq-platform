# HTTPS v-host (mounted only with serve-docker --https)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64M;
    charset utf-8;

    # Local mkcert CA for installing green-padlock trust on client machines.
    location = /dev-ca.crt {
        alias /etc/nginx/certs/rootCA.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="gereq-dev-rootCA.crt"';
        access_log off;
    }

    # Hashed Bun production build (immutable). Manifest must stay fresh for bun run dev.
    location = /build/manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
        access_log off;
    }
    location = /build/.dev {
        add_header Cache-Control "no-store";
        try_files $uri =404;
        access_log off;
    }
    location /build/ {
        # Production: long cache for content-hashed files.
        # Watch mode (`bun run dev`) uses stable names + ?v=mtime from RenderEngine.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    # X-Accel-Redirect targets for MediaFileDelivery
    location /internal-media/ {
        internal;
        alias /var/www/html/storage/uploads/;
    }
    location /internal-media-cache/ {
        internal;
        alias /var/www/html/storage/cache/media/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Crawler / agent discovery → public API (no SPA HTML).
    location = /robots.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/robots.txt;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/sitemap.xml;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /llms.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/llms.txt;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /tools.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/tools.json;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /ai.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/ai.txt;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /.well-known/ai.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/ai.txt;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /llms-full.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/llms-full.txt;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
