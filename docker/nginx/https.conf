# HTTPS v-host (mounted only with serve-docker --https)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64M;
    charset utf-8;

    # Local mkcert CA for installing green-padlock trust on client machines.
    location = /dev-ca.crt {
        alias /etc/nginx/certs/rootCA.pem;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="gereq-dev-rootCA.crt"';
        access_log off;
    }

    # Hashed Bun build output (scripts/build.ts → public/build).
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
