server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    charset utf-8;

    # Hashed Bun production build (immutable). Manifest must stay fresh for bun run dev.
    location = /build/manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
        access_log off;
    }
    location = /build/.dev {
        add_header Cache-Control "no-store";
        try_files $uri =404;
        access_log off;
    }
    location /build/ {
        # Production: long cache for content-hashed files.
        # Watch mode (`bun run dev`) uses stable names + ?v=mtime from RenderEngine.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Crawler / agent discovery → public API (no SPA HTML).
    location = /robots.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/robots.txt;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/sitemap.xml;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /llms.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus/llms.txt;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /tools.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/tools.json;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /ai.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/ai.txt;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /.well-known/ai.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/ai.txt;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }
    location = /llms-full.txt {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /api/public/webplus-ai/llms-full.txt;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
