; Overrides default www pool (pm.max_children=5) for concurrent storefront load.
; Values can still be overridden at runtime by entrypoint from PHP_FPM_* env.

[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_spawn_rate = 32
pm.max_requests = 500
pm.process_idle_timeout = 10s
