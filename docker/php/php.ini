memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
opcache.enable = 1
opcache.validate_timestamps = 1
; 0 = stat every request (hurts Docker bind-mounts under concurrent load).
opcache.revalidate_freq = 2
