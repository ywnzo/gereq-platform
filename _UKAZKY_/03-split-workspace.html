<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEREQ Platform · Split Workspace</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700" rel="stylesheet">
<script>
(function () {
  var t = localStorage.getItem('gereq-proto-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --accent: #D7FF45;
  --accent-ink: #0A0B0A;
  --bg: #f4f4f5;
  --bg-elev: #ffffff;
  --bg-muted: #fafafa;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #a1a1aa;
  --rail: #0A0B0A;
  --rail-text: #a1a1aa;
  --rail-hover: #27272a;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --ok: #16a34a;
  --warn: #ca8a04;
  --radius: 12px;
  --radius-sm: 8px;
  --rail-w: 64px;
  --list-w: 380px;
  --font: 'DM Sans', system-ui, sans-serif;
  --focus: 0 0 0 3px rgba(215,255,69,.45);
}
[data-theme="dark"] {
  --bg: #09090b;
  --bg-elev: #18181b;
  --bg-muted: #141416;
  --border: #27272a;
  --border-strong: #3f3f46;
  --text: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --rail: #000000;
  --rail-text: #71717a;
  --rail-hover: #27272a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
  --danger-bg: #450a0a;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
[x-cloak] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }

/* Layout */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  height: 100vh;
  overflow: hidden;
}

/* Icon rail */
.rail {
  background: var(--rail);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 4px;
  z-index: 40;
  border-right: 1px solid transparent;
}
.rail__brand {
  width: 36px; height: 36px;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center;
}
.rail__brand img { width: 32px; height: 32px; display: block; border-radius: 6px; }
.rail__nav { flex: 1; display: flex; flex-direction: column; gap: 2px; width: 100%; align-items: center; }
.rail__btn {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--rail-text);
  position: relative;
  transition: background .15s, color .15s;
}
.rail__btn:hover { background: var(--rail-hover); color: #fff; }
.rail__btn.is-active {
  background: var(--accent);
  color: var(--accent-ink);
}
.rail__btn.is-active svg { stroke: var(--accent-ink); }
.rail__btn[title]::after {
  content: attr(title);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%; transform: translateY(-50%);
  background: #18181b; color: #fff;
  font-size: 12px; font-weight: 500;
  padding: 5px 10px; border-radius: 6px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .12s;
  z-index: 50;
  box-shadow: var(--shadow-lg);
}
.rail__btn:hover::after { opacity: 1; }
.rail__foot { display: flex; flex-direction: column; gap: 2px; align-items: center; margin-top: auto; padding-top: 8px; }
.rail__btn svg { width: 20px; height: 20px; }

/* Main column */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* Topbar */
.topbar {
  height: 52px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.topbar::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--accent);
  opacity: .85;
}
.topbar__brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 15px; letter-spacing: .02em;
}
.topbar__brand span.sub {
  font-weight: 500; color: var(--text-3); font-size: 12px;
  letter-spacing: .04em; text-transform: uppercase; margin-left: 2px;
}
.topbar__crumb {
  color: var(--text-2); font-size: 13px; font-weight: 500;
  padding-left: 16px; border-left: 1px solid var(--border);
}
.topbar__spacer { flex: 1; }
.topbar__search {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-3);
  font-size: 13px;
  cursor: pointer;
  min-width: 200px;
  transition: border-color .15s;
}
.topbar__search:hover { border-color: var(--border-strong); }
.topbar__search kbd {
  margin-left: auto;
  font-size: 11px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--text-3);
  font-family: inherit;
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--bg); border-color: var(--border); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

/* Content */
.content {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.content--scroll {
  overflow: auto;
  padding: 24px 28px 40px;
}
.content--split {
  display: grid;
  grid-template-columns: var(--list-w) 1fr;
  overflow: hidden;
}

/* Page header (full pages) */
.page-head {
  margin-bottom: 24px;
}
.page-head__eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 6px;
}
.page-head__row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.page-head h1 {
  margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em;
}
.page-head p {
  margin: 6px 0 0; color: var(--text-2); font-size: 14px; max-width: 520px;
}

/* Cards / panels */
.panel {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.panel__pad { padding: 20px 22px; }
.panel__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 13px;
}
.grid-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
@media (max-width: 1100px) {
  .grid-stats { grid-template-columns: repeat(2, 1fr); }
}
.stat {
  padding: 18px 20px;
}
.stat__label { font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 8px; }
.stat__value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.stat__meta { margin-top: 8px; font-size: 12px; color: var(--text-2); }
.stat__meta .up { color: var(--ok); font-weight: 600; }
.stat__meta .down { color: var(--danger); font-weight: 600; }

.grid-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
}
@media (max-width: 960px) {
  .grid-2 { grid-template-columns: 1fr; }
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px;
  border-radius: 8px;
  font-weight: 600; font-size: 13px;
  border: 1px solid transparent;
  transition: background .15s, border-color .15s, opacity .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: color-mix(in srgb, var(--accent) 70%, #000);
}
.btn--primary:hover:not(:disabled) { filter: brightness(.96); box-shadow: 0 0 0 3px rgba(215,255,69,.25); }
.btn--ghost {
  background: var(--bg-elev);
  border-color: var(--border);
  color: var(--text);
}
.btn--ghost:hover:not(:disabled) { background: var(--bg); border-color: var(--border-strong); }
.btn--danger {
  background: var(--danger);
  color: #fff;
}
.btn--danger:hover:not(:disabled) { filter: brightness(1.05); }
.btn--sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }

/* Forms */
.field { margin-bottom: 14px; }
.field__label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-2); margin-bottom: 6px;
}
.field__hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.field__error { font-size: 12px; color: var(--danger); margin-top: 5px; font-weight: 500; }
.input, .select, .textarea {
  width: 100%;
  height: 38px;
  padding: 0 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border-strong));
  box-shadow: var(--focus);
}
.input.is-invalid, .select.is-invalid, .textarea.is-invalid {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px rgba(220,38,38,.15);
}
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row .input { flex: 1; }

/* Toggle */
.toggle {
  position: relative;
  width: 40px; height: 22px;
  border-radius: 999px;
  background: var(--border-strong);
  transition: background .2s;
  flex-shrink: 0;
}
.toggle.is-on { background: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: transform .2s;
}
.toggle.is-on::after { transform: translateX(18px); }
[data-theme="dark"] .toggle.is-on::after { background: var(--accent-ink); }

/* Badge / status */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: var(--bg); color: var(--text-2);
  border: 1px solid var(--border);
}
.badge--ok { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
.badge--warn { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge--muted { background: var(--bg); color: var(--text-3); }
.badge--danger { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
[data-theme="dark"] .badge--ok { background: #052e16; color: #4ade80; border-color: #14532d; }
[data-theme="dark"] .badge--warn { background: #422006; color: #facc15; border-color: #713f12; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px 0 10px;
  border-radius: 6px;
  font-size: 12px; font-weight: 500;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text-2);
}
.tag button {
  width: 16px; height: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 14px; line-height: 1;
}
.tag button:hover { background: var(--border); color: var(--text); }

/* Customers split */
.clist {
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg-elev);
  min-height: 0;
  overflow: hidden;
}
.clist__toolbar {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; flex-direction: column; gap: 10px;
}
.clist__filters {
  display: flex; gap: 4px; flex-wrap: wrap;
}
.filter-chip {
  height: 28px; padding: 0 10px;
  border-radius: 999px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--border);
  color: var(--text-2);
  background: transparent;
}
.filter-chip:hover { background: var(--bg); }
.filter-chip.is-active {
  background: var(--accent);
  border-color: transparent;
  color: var(--accent-ink);
  font-weight: 600;
}
.clist__list {
  flex: 1; overflow: auto; padding: 8px;
}
.citem {
  display: block; width: 100%; text-align: left;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  margin-bottom: 2px;
  transition: background .12s, border-color .12s;
}
.citem:hover { background: var(--bg); }
.citem.is-selected {
  background: var(--bg);
  border-color: var(--border);
  border-left-color: var(--accent);
}
.citem__top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 2px;
}
.citem__name { font-weight: 600; font-size: 13.5px; }
.citem__meta { font-size: 12px; color: var(--text-3); }
.clist__empty {
  padding: 40px 20px; text-align: center; color: var(--text-3); font-size: 13px;
}

.cdetail {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  overflow: hidden;
  background: var(--bg);
}
.cdetail__empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); flex-direction: column; gap: 8px;
}
.cdetail__scroll {
  flex: 1; overflow: auto; padding: 22px 26px 36px;
}
.cdetail__head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 20px;
}
.cdetail__title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.cdetail__sub { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
.cdetail__actions { display: flex; gap: 8px; flex-shrink: 0; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 1100px) {
  .detail-grid { grid-template-columns: 1fr; }
}
.detail-grid .span-2 { grid-column: 1 / -1; }

.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 10px;
}

.kv { display: grid; gap: 12px; }
.kv__row {
  display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: start;
}
.kv__k { font-size: 12px; font-weight: 600; color: var(--text-3); padding-top: 8px; }
.kv__v { min-width: 0; }

.inline-select {
  height: 34px; padding: 0 10px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-elev); outline: none;
}
.inline-select:focus { box-shadow: var(--focus); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }

.tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 0; }
.titem {
  display: grid; grid-template-columns: 16px 1fr; gap: 12px;
  position: relative; padding-bottom: 16px;
}
.titem:last-child { padding-bottom: 0; }
.titem__dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg-elev);
  box-shadow: 0 0 0 1px var(--border);
  margin-top: 4px; position: relative; z-index: 1;
}
.titem::before {
  content: '';
  position: absolute; left: 4px; top: 16px; bottom: 0;
  width: 2px; background: var(--border);
}
.titem:last-child::before { display: none; }
.titem__body { min-width: 0; }
.titem__text { font-size: 13px; }
.titem__meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* Tasks */
.task {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.task:last-child { border-bottom: none; }
.task.is-done .task__label { text-decoration: line-through; color: var(--text-3); }
.checkbox {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
  transition: background .15s, border-color .15s;
}
.checkbox.is-checked {
  background: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 70%, #000);
  color: var(--accent-ink);
}
.checkbox svg { width: 12px; height: 12px; }
.task__label { font-size: 13px; flex: 1; }
.task__due { font-size: 11px; color: var(--text-3); }

/* Tables */
.table-wrap { overflow: auto; }
table.data {
  width: 100%; border-collapse: collapse;
}
table.data th, table.data td {
  text-align: left; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
table.data th {
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-3);
  background: var(--bg-muted);
}
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: var(--bg); }

/* Module cards */
.mod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.mod-card {
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.mod-card__top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.mod-card__icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
.mod-card__icon svg { width: 20px; height: 20px; }
.mod-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.mod-card p { margin: 0; font-size: 13px; color: var(--text-2); }

/* Role cards */
.role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}
.role-card { padding: 18px; }
.role-card h3 { margin: 0 0 6px; font-size: 15px; }
.role-card p { margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
.perm-list { display: flex; flex-wrap: wrap; gap: 6px; }

/* Audit */
.audit-list { padding: 0; }
.audit-row {
  display: grid;
  grid-template-columns: 140px 1fr 120px;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.audit-row:last-child { border-bottom: none; }
.audit-row__time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.audit-row__msg { font-size: 13px; }
.audit-row__actor { font-size: 12px; color: var(--text-2); text-align: right; }

/* Settings */
.settings-form .field-row {
  display: grid;
  grid-template-columns: 180px 1fr 200px;
  gap: 16px;
  align-items: start;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.settings-form .field-row:last-child { border-bottom: none; }
.settings-form .field-row .lbl { font-weight: 600; font-size: 13px; padding-top: 8px; }
.settings-form .field-row .help { font-size: 12px; color: var(--text-3); padding-top: 8px; }

/* Modal */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 480px;
  max-height: calc(100vh - 48px);
  overflow: auto;
}
.modal--sm { max-width: 400px; }
.modal--cmd { max-width: 520px; padding: 0; overflow: hidden; }
.modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal__head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.modal__body { padding: 18px 20px; }
.modal__foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-muted);
}

/* Command palette */
.cmd-input-wrap {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.cmd-input-wrap svg { width: 18px; height: 18px; color: var(--text-3); flex-shrink: 0; }
.cmd-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 15px; height: 28px;
}
.cmd-list { max-height: 320px; overflow: auto; padding: 8px; }
.cmd-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 8px;
  font-size: 13px;
}
.cmd-item:hover, .cmd-item.is-active { background: var(--bg); }
.cmd-item__icon {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
}
.cmd-item__icon svg { width: 14px; height: 14px; }
.cmd-item__kbd {
  margin-left: auto; font-size: 11px; color: var(--text-3);
}
.cmd-empty { padding: 24px; text-align: center; color: var(--text-3); font-size: 13px; }

/* Toasts */
.toasts {
  position: fixed; bottom: 20px; right: 20px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  min-width: 260px; max-width: 360px;
  padding: 12px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  font-size: 13px; font-weight: 500;
  animation: toast-in .2s ease;
}
.toast__dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.toast--error .toast__dot { background: var(--danger); }
.toast button {
  margin-left: auto; color: var(--text-3); font-size: 16px; line-height: 1;
  padding: 2px 4px;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Activity add */
.add-note {
  display: flex; gap: 8px; margin-top: 12px;
}
.add-note .input { flex: 1; height: 34px; }

.empty-state {
  text-align: center; padding: 48px 24px; color: var(--text-3);
}
.empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: .5; }

.user-avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--text-2);
}
</style>
</head>
<body>
<div class="app" x-data="gereqApp()" x-cloak @keydown.window="onKey($event)">

  <!-- Slim icon rail -->
  <aside class="rail" aria-label="Navigace">
    <a href="#" class="rail__brand" @click.prevent="go('dashboard')" title="GEREQ">
      <img src="gereq-mark.svg" alt="GEREQ">
    </a>
    <nav class="rail__nav">
      <template x-for="item in nav" :key="item.id">
        <button type="button" class="rail__btn"
          :class="page === item.id && 'is-active'"
          :title="item.label"
          @click="go(item.id)"
          :aria-current="page === item.id ? 'page' : null">
          <span x-html="icons[item.icon]"></span>
        </button>
      </template>
    </nav>
    <div class="rail__foot">
      <button type="button" class="rail__btn" title="Přepnout motiv" @click="toggleTheme()">
        <span x-show="theme === 'light'" x-html="icons.moon"></span>
        <span x-show="theme === 'dark'" x-html="icons.sun"></span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__brand">
        GEREQ <span class="sub">Platform</span>
      </div>
      <div class="topbar__crumb" x-text="navLabel"></div>
      <div class="topbar__spacer"></div>
      <button type="button" class="topbar__search" @click="openCommand()">
        <span x-html="icons.search" style="display:flex"></span>
        Hledat…
        <kbd x-text="modKey + 'K'"></kbd>
      </button>
      <button type="button" class="icon-btn" title="Přepnout motiv" @click="toggleTheme()" aria-label="Motiv">
        <span x-show="theme === 'light'" x-html="icons.moon"></span>
        <span x-show="theme === 'dark'" x-html="icons.sun"></span>
      </button>
    </header>

    <!-- CUSTOMERS: master-detail -->
    <div class="content content--split" x-show="page === 'customers'" x-cloak>
      <div class="clist">
        <div class="clist__toolbar">
          <div style="display:flex;gap:8px;align-items:center">
            <input class="input" type="search" placeholder="Hledat zákazníky…" x-model="customerQuery" style="flex:1;height:34px">
            <button type="button" class="btn btn--primary btn--sm" @click="openCustomerModal()" title="Nový zákazník">
              <span x-html="icons.plus"></span>
            </button>
          </div>
          <div class="clist__filters">
            <button type="button" class="filter-chip" :class="customerFilter === 'all' && 'is-active'" @click="customerFilter = 'all'">Všichni</button>
            <button type="button" class="filter-chip" :class="customerFilter === 'active' && 'is-active'" @click="customerFilter = 'active'">Aktivní</button>
            <button type="button" class="filter-chip" :class="customerFilter === 'trial' && 'is-active'" @click="customerFilter = 'trial'">Zkušební</button>
            <button type="button" class="filter-chip" :class="customerFilter === 'paused' && 'is-active'" @click="customerFilter = 'paused'">Pozastaveno</button>
          </div>
        </div>
        <div class="clist__list">
          <template x-for="c in filteredCustomers" :key="c.id">
            <button type="button" class="citem"
              :class="selectedId === c.id && 'is-selected'"
              @click="selectCustomer(c.id)">
              <div class="citem__top">
                <span class="citem__name" x-text="c.name"></span>
                <span class="badge" :class="statusBadge(c.status)" x-text="statusLabel(c.status)"></span>
              </div>
              <div class="citem__meta" x-text="c.email"></div>
            </button>
          </template>
          <div class="clist__empty" x-show="filteredCustomers.length === 0">
            Žádní zákazníci neodpovídají filtru.
          </div>
        </div>
      </div>

      <div class="cdetail">
        <template x-if="!selected">
          <div class="cdetail__empty">
            <span x-html="icons.users" style="opacity:.4;width:36px;height:36px;display:block"></span>
            <div>Vyberte zákazníka ze seznamu</div>
          </div>
        </template>
        <template x-if="selected">
          <div class="cdetail__scroll">
            <div class="cdetail__head">
              <div>
                <h2 class="cdetail__title" x-text="selected.name"></h2>
                <p class="cdetail__sub" x-text="selected.email + ' · ' + selected.phone"></p>
              </div>
              <div class="cdetail__actions">
                <button type="button" class="btn btn--ghost btn--sm" @click="openCustomerModal(selected)">Upravit</button>
                <button type="button" class="btn btn--ghost btn--sm" style="color:var(--danger)" @click="confirmDelete(selected)">Smazat</button>
              </div>
            </div>

            <div class="detail-grid">
              <div class="panel panel__pad">
                <div class="section-label">Přehled</div>
                <div class="kv">
                  <div class="kv__row">
                    <div class="kv__k">Stav</div>
                    <div class="kv__v">
                      <select class="inline-select" :value="selected.status" @change="updateStatus(selected, $event.target.value)">
                        <option value="active">Aktivní</option>
                        <option value="trial">Zkušební</option>
                        <option value="paused">Pozastaveno</option>
                      </select>
                    </div>
                  </div>
                  <div class="kv__row">
                    <div class="kv__k">Poznámka</div>
                    <div class="kv__v">
                      <textarea class="textarea" rows="2" :value="selected.note"
                        @blur="updateNote(selected, $event.target.value)"
                        @keydown.meta.enter="$event.target.blur()"
                        @keydown.ctrl.enter="$event.target.blur()"
                        placeholder="Interní poznámka…"></textarea>
                    </div>
                  </div>
                  <div class="kv__row">
                    <div class="kv__k">Štítky</div>
                    <div class="kv__v">
                      <div class="tags-wrap">
                        <template x-for="(tag, ti) in selected.tags" :key="tag + ti">
                          <span class="tag">
                            <span x-text="tag"></span>
                            <button type="button" @click="removeTag(selected, ti)" aria-label="Odebrat">&times;</button>
                          </span>
                        </template>
                        <div class="input-row" style="flex:1;min-width:140px">
                          <input class="input" style="height:28px;font-size:12px" placeholder="Přidat štítek…"
                            x-model="newTag"
                            @keydown.enter.prevent="addTag(selected)">
                          <button type="button" class="btn btn--ghost btn--sm" @click="addTag(selected)">+</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="panel panel__pad">
                <div class="section-label">Úkoly</div>
                <template x-for="task in selected.tasks" :key="task.id">
                  <div class="task" :class="task.done && 'is-done'">
                    <button type="button" class="checkbox" :class="task.done && 'is-checked'" @click="toggleTask(selected, task)" aria-label="Hotovo">
                      <svg x-show="task.done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>
                    </button>
                    <div class="task__label" x-text="task.title"></div>
                    <div class="task__due" x-text="task.due"></div>
                  </div>
                </template>
                <div x-show="selected.tasks.length === 0" style="color:var(--text-3);font-size:13px">Žádné úkoly</div>
              </div>

              <div class="panel panel__pad span-2">
                <div class="section-label">Aktivita</div>
                <div class="timeline">
                  <template x-for="ev in selected.activity" :key="ev.id">
                    <div class="titem">
                      <div class="titem__dot"></div>
                      <div class="titem__body">
                        <div class="titem__text" x-text="ev.text"></div>
                        <div class="titem__meta" x-text="ev.at + ' · ' + ev.by"></div>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="add-note">
                  <input class="input" placeholder="Přidat poznámku do timeline…"
                    x-model="activityDraft"
                    @keydown.enter.prevent="addActivity(selected)">
                  <button type="button" class="btn btn--primary btn--sm" @click="addActivity(selected)">Přidat</button>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Other pages -->
    <div class="content content--scroll" x-show="page !== 'customers'" x-cloak>

      <!-- DASHBOARD -->
      <template x-if="page === 'dashboard'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Přehled</div>
            <div class="page-head__row">
              <div>
                <h1>Dashboard</h1>
                <p>Souhrn platformy GEREQ — zákazníci, moduly a aktivita.</p>
              </div>
              <button type="button" class="btn btn--primary" @click="go('customers'); openCustomerModal()">
                <span x-html="icons.plus"></span> Nový zákazník
              </button>
            </div>
          </div>
          <div class="grid-stats">
            <div class="panel stat">
              <div class="stat__label">Zákazníci</div>
              <div class="stat__value" x-text="customers.length"></div>
              <div class="stat__meta"><span class="up">+2</span> tento měsíc</div>
            </div>
            <div class="panel stat">
              <div class="stat__label">Aktivní</div>
              <div class="stat__value" x-text="customers.filter(c => c.status === 'active').length"></div>
              <div class="stat__meta">z celku</div>
            </div>
            <div class="panel stat">
              <div class="stat__label">Moduly zapnuté</div>
              <div class="stat__value" x-text="modules.filter(m => m.enabled).length"></div>
              <div class="stat__meta" x-text="'z ' + modules.length"></div>
            </div>
            <div class="panel stat">
              <div class="stat__label">Uživatelé</div>
              <div class="stat__value" x-text="users.filter(u => u.active).length"></div>
              <div class="stat__meta">aktivních účtů</div>
            </div>
          </div>
          <div class="grid-2">
            <div class="panel">
              <div class="panel__head">Nedávná aktivita</div>
              <div class="audit-list">
                <template x-for="a in audit.slice(0, 5)" :key="a.id">
                  <div class="audit-row" style="grid-template-columns:120px 1fr 100px">
                    <div class="audit-row__time" x-text="a.at"></div>
                    <div class="audit-row__msg" x-text="a.msg"></div>
                    <div class="audit-row__actor" x-text="a.actor"></div>
                  </div>
                </template>
              </div>
            </div>
            <div class="panel">
              <div class="panel__head">Rychlé akce</div>
              <div class="panel__pad" style="display:flex;flex-direction:column;gap:8px">
                <button type="button" class="btn btn--ghost" style="justify-content:flex-start" @click="go('customers')">Správa zákazníků</button>
                <button type="button" class="btn btn--ghost" style="justify-content:flex-start" @click="go('modules')">Konfigurace modulů</button>
                <button type="button" class="btn btn--ghost" style="justify-content:flex-start" @click="go('users')">Uživatelé platformy</button>
                <button type="button" class="btn btn--ghost" style="justify-content:flex-start" @click="openCommand()">Otevřít příkazovou paletu</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- USERS -->
      <template x-if="page === 'users'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Přístup</div>
            <div class="page-head__row">
              <div>
                <h1>Uživatelé</h1>
                <p>Účty s přístupem do administrace GEREQ Platform.</p>
              </div>
            </div>
          </div>
          <div class="panel table-wrap">
            <table class="data">
              <thead>
                <tr>
                  <th>Uživatel</th>
                  <th>E-mail</th>
                  <th>Role</th>
                  <th>Aktivní</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="u in users" :key="u.id">
                  <tr>
                    <td>
                      <div style="display:flex;align-items:center;gap:10px">
                        <div class="user-avatar" x-text="initials(u.name)"></div>
                        <strong x-text="u.name"></strong>
                      </div>
                    </td>
                    <td x-text="u.email"></td>
                    <td><span class="badge" x-text="u.role"></span></td>
                    <td>
                      <button type="button" class="toggle" :class="u.active && 'is-on'"
                        @click="toggleUser(u)" :aria-pressed="u.active" :aria-label="'Aktivní: ' + u.name"></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- ROLES -->
      <template x-if="page === 'roles'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Přístup</div>
            <h1>Role</h1>
            <p>Oprávnění přiřazená uživatelům platformy.</p>
          </div>
          <div class="role-grid">
            <template x-for="r in roles" :key="r.id">
              <div class="panel role-card">
                <h3 x-text="r.name"></h3>
                <p x-text="r.desc"></p>
                <div class="perm-list">
                  <template x-for="p in r.perms" :key="p">
                    <span class="badge" x-text="p"></span>
                  </template>
                </div>
                <div style="margin-top:14px;font-size:12px;color:var(--text-3)" x-text="r.users + ' uživatelů'"></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- MODULES -->
      <template x-if="page === 'modules'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Platforma</div>
            <h1>Moduly</h1>
            <p>Zapínejte a vypínejte funkční celky platformy.</p>
          </div>
          <div class="mod-grid">
            <template x-for="m in modules" :key="m.id">
              <div class="panel mod-card">
                <div class="mod-card__top">
                  <div class="mod-card__icon" x-html="icons[m.icon]"></div>
                  <button type="button" class="toggle" :class="m.enabled && 'is-on'"
                    @click="toggleModule(m)" :aria-pressed="m.enabled"></button>
                </div>
                <div>
                  <h3 x-text="m.name"></h3>
                  <p x-text="m.desc"></p>
                </div>
                <div>
                  <span class="badge" :class="m.enabled ? 'badge--ok' : 'badge--muted'"
                    x-text="m.enabled ? 'Zapnuto' : 'Vypnuto'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- AUDIT -->
      <template x-if="page === 'audit'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Bezpečnost</div>
            <h1>Audit</h1>
            <p>Záznam změn a událostí v administraci.</p>
          </div>
          <div class="panel">
            <div class="audit-list">
              <template x-for="a in audit" :key="a.id">
                <div class="audit-row">
                  <div class="audit-row__time" x-text="a.at"></div>
                  <div class="audit-row__msg" x-text="a.msg"></div>
                  <div class="audit-row__actor" x-text="a.actor"></div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- SETTINGS -->
      <template x-if="page === 'settings'">
        <div>
          <div class="page-head">
            <div class="page-head__eyebrow">Systém</div>
            <div class="page-head__row">
              <div>
                <h1>Nastavení</h1>
                <p>Základní konfigurace instance GEREQ Platform.</p>
              </div>
              <button type="button" class="btn btn--primary" @click="saveSettings()" :disabled="!settingsValid">Uložit</button>
            </div>
          </div>
          <div class="panel panel__pad settings-form">
            <div class="field-row">
              <div class="lbl">Název instance</div>
              <div>
                <input class="input" :class="settingsErrors.name && 'is-invalid'" x-model="settings.name" @input="validateSettings()">
                <div class="field__error" x-show="settingsErrors.name" x-text="settingsErrors.name"></div>
              </div>
              <div class="help">Zobrazí se v záhlaví administrace</div>
            </div>
            <div class="field-row">
              <div class="lbl">Kontaktní e-mail</div>
              <div>
                <input class="input" type="email" :class="settingsErrors.email && 'is-invalid'" x-model="settings.email" @input="validateSettings()">
                <div class="field__error" x-show="settingsErrors.email" x-text="settingsErrors.email"></div>
              </div>
              <div class="help">Pro systémová upozornění</div>
            </div>
            <div class="field-row">
              <div class="lbl">Časové pásmo</div>
              <div>
                <select class="select" x-model="settings.tz">
                  <option value="Europe/Prague">Europe/Prague</option>
                  <option value="Europe/Bratislava">Europe/Bratislava</option>
                  <option value="UTC">UTC</option>
                </select>
              </div>
              <div class="help">Pro audit a plánované úlohy</div>
            </div>
            <div class="field-row">
              <div class="lbl">Jazyk UI</div>
              <div>
                <select class="select" x-model="settings.lang">
                  <option value="cs">Čeština</option>
                  <option value="sk">Slovenština</option>
                  <option value="en">English</option>
                </select>
              </div>
              <div class="help">Výchozí jazyk administrace</div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Customer modal -->
  <div class="overlay" x-show="modal.customer" x-cloak @click.self="closeModals()" @keydown.escape.window="closeModals()">
    <div class="modal" role="dialog" aria-modal="true" :aria-label="editingCustomer ? 'Upravit zákazníka' : 'Nový zákazník'">
      <div class="modal__head">
        <h2 x-text="editingCustomer ? 'Upravit zákazníka' : 'Nový zákazník'"></h2>
        <button type="button" class="icon-btn" @click="closeModals()" aria-label="Zavřít">&times;</button>
      </div>
      <div class="modal__body">
        <div class="field">
          <label class="field__label">Název / jméno</label>
          <input class="input" :class="formErrors.name && 'is-invalid'" x-model="form.name" @input="validateForm()" placeholder="např. Acme s.r.o.">
          <div class="field__error" x-show="formErrors.name" x-text="formErrors.name"></div>
        </div>
        <div class="field">
          <label class="field__label">E-mail</label>
          <input class="input" type="email" :class="formErrors.email && 'is-invalid'" x-model="form.email" @input="validateForm()" placeholder="kontakt@firma.cz">
          <div class="field__error" x-show="formErrors.email" x-text="formErrors.email"></div>
        </div>
        <div class="field">
          <label class="field__label">Telefon</label>
          <input class="input" :class="formErrors.phone && 'is-invalid'" x-model="form.phone" @input="validateForm()" placeholder="+420 777 123 456">
          <div class="field__error" x-show="formErrors.phone" x-text="formErrors.phone"></div>
        </div>
        <div class="field">
          <label class="field__label">Stav</label>
          <select class="select" x-model="form.status">
            <option value="active">Aktivní</option>
            <option value="trial">Zkušební</option>
            <option value="paused">Pozastaveno</option>
          </select>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" @click="closeModals()">Zrušit</button>
        <button type="button" class="btn btn--primary" @click="saveCustomer()" :disabled="!formValid">Uložit</button>
      </div>
    </div>
  </div>

  <!-- Delete confirm -->
  <div class="overlay" x-show="modal.delete" x-cloak @click.self="closeModals()">
    <div class="modal modal--sm" role="dialog" aria-modal="true" aria-label="Potvrzení smazání">
      <div class="modal__head">
        <h2>Smazat zákazníka?</h2>
        <button type="button" class="icon-btn" @click="closeModals()" aria-label="Zavřít">&times;</button>
      </div>
      <div class="modal__body">
        <p style="margin:0;color:var(--text-2);font-size:13px">
          Opravdu smazat <strong x-text="deleteTarget && deleteTarget.name"></strong>? Tuto akci nelze vrátit.
        </p>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" @click="closeModals()">Zrušit</button>
        <button type="button" class="btn btn--danger" @click="doDelete()">Smazat</button>
      </div>
    </div>
  </div>

  <!-- Command palette -->
  <div class="overlay" x-show="modal.command" x-cloak @click.self="closeModals()">
    <div class="modal modal--cmd" role="dialog" aria-modal="true" aria-label="Příkazová paleta">
      <div class="cmd-input-wrap">
        <span x-html="icons.search"></span>
        <input class="cmd-input" type="text" placeholder="Příkaz nebo stránka…"
          x-model="cmdQuery" x-ref="cmdInput"
          @keydown.down.prevent="cmdMove(1)"
          @keydown.up.prevent="cmdMove(-1)"
          @keydown.enter.prevent="cmdRun()">
      </div>
      <div class="cmd-list">
        <template x-for="(item, i) in filteredCommands" :key="item.id">
          <button type="button" class="cmd-item" :class="cmdIndex === i && 'is-active'"
            @click="cmdExec(item)" @mouseenter="cmdIndex = i">
            <span class="cmd-item__icon" x-html="icons[item.icon]"></span>
            <span x-text="item.label"></span>
            <span class="cmd-item__kbd" x-text="item.hint || ''"></span>
          </button>
        </template>
        <div class="cmd-empty" x-show="filteredCommands.length === 0">Nic nenalezeno</div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" :class="t.type === 'error' && 'toast--error'">
        <span class="toast__dot"></span>
        <span x-text="t.msg"></span>
        <button type="button" @click="dismissToast(t.id)" aria-label="Zavřít">&times;</button>
      </div>
    </template>
  </div>
</div>

  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5v8l9 5 9-5V8Z"/><path d="M3.3 7.9 12 13l8.7-5.1M12 22V13"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',

  zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
};

function gereqApp() {
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
  return {

    page: 'customers',
    selectedId: 1,
    customerQuery: '',
    customerFilter: 'all',
    newTag: '',
    activityDraft: '',
    toasts: [],
    toastSeq: 1,
    idSeq: 100,
    modal: { customer: false, delete: false, command: false },
    editingCustomer: null,
    deleteTarget: null,
    form: { name: '', email: '', phone: '', status: 'active' },
    formErrors: {},
    formTouched: false,
    cmdQuery: '',
    cmdIndex: 0,
    settings: { name: 'GEREQ Demo', email: 'admin@gereq.cz', tz: 'Europe/Prague', lang: 'cs' },

    ],

    customers: [
      {

        status: 'active', note: 'Prioritní zákazník — SLA 4h.',
        tags: ['enterprise', 'logistika'],
        tasks: [
          { id: 1, title: 'Obnovit smlouvu SLA', done: false, due: '12. 9.' },

        ],
        activity: [
          { id: 1, text: 'Stav změněn na Aktivní', at: '2. 9. 2026 09:14', by: 'Admin' },
          { id: 2, text: 'Přidán štítek enterprise', at: '28. 8. 2026 16:02', by: 'Admin' },
        ],
      },
      {
        id: 2, name: 'Cafe Roastery', email: 'hello@roastery.cz', phone: '+420 603 555 110',
        status: 'trial', note: 'Zkušební provoz e-shop modulu.',
        tags: ['retail', 'trial'],
        tasks: [
          { id: 1, title: 'Ověřit platební bránu', done: false, due: '5. 9.' },
        ],
        activity: [
          { id: 1, text: 'Zákazník vytvořen', at: '20. 8. 2026 11:30', by: 'System' },
        ],
      },
      {
        id: 3, name: 'MedTech Brno s.r.o.', email: 'it@medtech.cz', phone: '+420 541 222 333',
        status: 'active', note: '',
        tags: ['healthcare'],
        tasks: [],
        activity: [
          { id: 1, text: 'Modul Audit zapnut', at: '15. 8. 2026 08:00', by: 'Admin' },
        ],
      },
      {
        id: 4, name: 'Studio Pixel', email: 'ahoj@studiopixel.cz', phone: '+420 728 900 011',
        status: 'paused', note: 'Pozastaveno na žádost klienta.',
        tags: ['agency'],

      {

        status: 'active', note: 'Sezónní špičky v Q3.',

        tasks: [

        ],

    ],

    users: [
      { id: 1, name: 'Jan Novák', email: 'jan@gereq.cz', role: 'Admin', active: true },

      { id: 3, name: 'Petr Horák', email: 'petr@gereq.cz', role: 'Viewer', active: false },
      { id: 4, name: 'Marie Králová', email: 'marie@gereq.cz', role: 'Editor', active: true },
    ],

    roles: [
      { id: 1, name: 'Admin', desc: 'Plný přístup k platformě a nastavení.', perms: ['customers.*', 'users.*', 'modules.*', 'settings.*'], users: 1 },
      { id: 2, name: 'Editor', desc: 'Správa zákazníků a modulů bez systémových nastavení.', perms: ['customers.*', 'modules.read'], users: 2 },
      { id: 3, name: 'Viewer', desc: 'Jen pro čtení přehledů a auditu.', perms: ['dashboard.read', 'audit.read'], users: 1 },
    ],

    modules: [
      { id: 1, name: 'Zákazníci', desc: 'Evidence a správa zákaznických účtů.', enabled: true, icon: 'users' },
      { id: 2, name: 'Notifikace', desc: 'E-mailová a in-app upozornění.', enabled: true, icon: 'mail' },
      { id: 3, name: 'Dokumenty', desc: 'Úložiště smluv a příloh.', enabled: false, icon: 'file' },
      { id: 4, name: 'Automatizace', desc: 'Pravidla a plánované úlohy.', enabled: true, icon: 'zap' },
      { id: 5, name: 'Audit log', desc: 'Detailní záznam změn.', enabled: true, icon: 'activity' },
      { id: 6, name: 'Integrace', desc: 'API konektory a webhooks.', enabled: false, icon: 'box' },
    ],

    audit: [
      { id: 1, at: '3. 9. 2026 09:41', msg: 'Přihlášení uživatele Jan Novák', actor: 'jan@gereq.cz' },
      { id: 2, at: '2. 9. 2026 16:18', msg: 'Modul Automatizace zapnut', actor: 'Admin' },
      { id: 3, at: '2. 9. 2026 09:14', msg: 'Zákazník Nordic Logistics — stav Aktivní', actor: 'Admin' },
      { id: 4, at: '1. 9. 2026 11:02', msg: 'Uživatel Petr Horák deaktivován', actor: 'Admin' },
      { id: 5, at: '28. 8. 2026 16:02', msg: 'Štítek enterprise přidán k Nordic Logistics', actor: 'Admin' },
      { id: 6, at: '20. 8. 2026 11:30', msg: 'Vytvořen zákazník Cafe Roastery', actor: 'System' },
    ],

    get navLabel() {
      const n = this.nav.find(i => i.id === this.page);
      return n ? n.label : '';
    },
    get selected() {
      return this.customers.find(c => c.id === this.selectedId) || null;
    },
    get filteredCustomers() {
      const q = this.customerQuery.trim().toLowerCase();
      return this.customers.filter(c => {
        if (this.customerFilter !== 'all' && c.status !== this.customerFilter) return false;
        if (!q) return true;
        return c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.phone.includes(q);
      });
    },
    get formValid() {
      return Object.keys(this.checkCustomerForm()).length === 0;
    },
    get settingsValid() {
      return Object.keys(this.checkSettings()).length === 0;
    },
    get commands() {
      return [
        ...this.nav.map(n => ({ id: 'nav-' + n.id, label: 'Přejít: ' + n.label, icon: n.icon, action: () => this.go(n.id) })),
        { id: 'new-cust', label: 'Nový zákazník', icon: 'plus', hint: 'N', action: () => { this.go('customers'); this.openCustomerModal(); } },
        { id: 'theme', label: 'Přepnout motiv', icon: this.theme === 'light' ? 'moon' : 'sun', action: () => this.toggleTheme() },
      ];
    },
    get filteredCommands() {
      const q = this.cmdQuery.trim().toLowerCase();
      if (!q) return this.commands;
      return this.commands.filter(c => c.label.toLowerCase().includes(q));
    },

    init() {
      document.documentElement.setAttribute('data-theme', this.theme);
    },

    go(id) {
      this.page = id;
      this.closeModals();
    },
    selectCustomer(id) {
      this.selectedId = id;
      this.newTag = '';
      this.activityDraft = '';
    },
    statusLabel(s) {
      return ({ active: 'Aktivní', trial: 'Zkušební', paused: 'Pozastaveno' })[s] || s;
    },
    statusBadge(s) {
      return ({ active: 'badge--ok', trial: 'badge--warn', paused: 'badge--muted' })[s] || '';
    },
    initials(name) {
      return name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    },

    toggleTheme() {
      this.theme = this.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', this.theme);
      localStorage.setItem('gereq-proto-theme', this.theme);
      this.toast('Motiv: ' + (this.theme === 'dark' ? 'tmavý' : 'světlý'));
    },

    toast(msg, type = 'ok') {
      const id = this.toastSeq++;
      this.toasts.push({ id, msg, type });
      setTimeout(() => this.dismissToast(id), 3200);
    },
    dismissToast(id) {
      this.toasts = this.toasts.filter(t => t.id !== id);
    },

    pushAudit(msg) {
      const now = new Date();
      const at = now.getDate() + '. ' + (now.getMonth() + 1) + '. ' + now.getFullYear() + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      this.audit.unshift({ id: this.idSeq++, at, msg, actor: 'Admin' });
    },

    updateStatus(c, status) {
      c.status = status;
      this.pushAudit('Zákazník ' + c.name + ' — stav ' + this.statusLabel(status));
      c.activity.unshift({ id: this.idSeq++, text: 'Stav změněn na ' + this.statusLabel(status), at: this.nowStr(), by: 'Admin' });
      this.toast('Stav uložen');
    },
    updateNote(c, note) {
      if (c.note === note) return;
      c.note = note;
      this.toast('Poznámka uložena');
    },
    addTag(c) {
      const t = this.newTag.trim();
      if (!t) return;
      if (c.tags.includes(t)) { this.toast('Štítek už existuje', 'error'); return; }
      c.tags.push(t);
      this.newTag = '';
      c.activity.unshift({ id: this.idSeq++, text: 'Přidán štítek ' + t, at: this.nowStr(), by: 'Admin' });
      this.toast('Štítek přidán');
    },
    removeTag(c, i) {
      const t = c.tags[i];
      c.tags.splice(i, 1);
      c.activity.unshift({ id: this.idSeq++, text: 'Odebrán štítek ' + t, at: this.nowStr(), by: 'Admin' });
      this.toast('Štítek odebrán');
    },
    addActivity(c) {
      const text = this.activityDraft.trim();
      if (!text) return;
      c.activity.unshift({ id: this.idSeq++, text, at: this.nowStr(), by: 'Admin' });
      this.activityDraft = '';
      this.pushAudit('Poznámka u ' + c.name);
      this.toast('Poznámka přidána');
    },
    toggleTask(c, task) {
      task.done = !task.done;
      this.toast(task.done ? 'Úkol hotov' : 'Úkol znovu otevřen');
    },
    nowStr() {
      const now = new Date();
      return now.getDate() + '. ' + (now.getMonth() + 1) + '. ' + now.getFullYear() + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    },

    openCustomerModal(c) {
      this.editingCustomer = c || null;
      if (c) {
        this.form = { name: c.name, email: c.email, phone: c.phone, status: c.status };
      } else {
        this.form = { name: '', email: '', phone: '', status: 'active' };
      }
      this.formErrors = {};
      this.formTouched = false;
      this.modal.customer = true;
    },
    checkCustomerForm() {
      const e = {};
      const name = this.form.name.trim();
      if (!name) e.name = 'Název je povinný';
      else if (name.length < 2) e.name = 'Minimálně 2 znaky';
      const email = this.form.email.trim();
      if (!email) e.email = 'E-mail je povinný';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = 'Neplatný formát e-mailu';
      const phone = this.form.phone.trim();
      if (phone) {
        const digits = phone.replace(/\D/g, '');
        if (digits.length < 9 || digits.length > 16) e.phone = 'Telefon: 9–16 číslic (volitelné)';
      }
      return e;
    },
    validateForm() {
      this.formTouched = true;
      this.formErrors = this.checkCustomerForm();
      return Object.keys(this.formErrors).length === 0;
    },
    saveCustomer() {
      if (!this.validateForm()) {
        this.toast('Opravte chyby ve formuláři', 'error');
        return;
      }
      if (this.editingCustomer) {
        Object.assign(this.editingCustomer, {
          name: this.form.name.trim(),
          email: this.form.email.trim(),
          phone: this.form.phone.trim(),
          status: this.form.status,
        });
        this.pushAudit('Upraven zákazník ' + this.editingCustomer.name);
        this.toast('Zákazník uložen');
      } else {
        const c = {
          id: this.idSeq++,
          name: this.form.name.trim(),
          email: this.form.email.trim(),
          phone: this.form.phone.trim(),
          status: this.form.status,
          note: '',
          tags: [],
          tasks: [],
          activity: [{ id: this.idSeq++, text: 'Zákazník vytvořen', at: this.nowStr(), by: 'Admin' }],
        };
        this.customers.unshift(c);
        this.selectedId = c.id;
        this.pushAudit('Vytvořen zákazník ' + c.name);
        this.toast('Zákazník vytvořen');
      }
      this.closeModals();
    },
    confirmDelete(c) {
      this.deleteTarget = c;
      this.modal.delete = true;
    },
    doDelete() {
      if (!this.deleteTarget) return;
      const id = this.deleteTarget.id;
      const name = this.deleteTarget.name;
      this.customers = this.customers.filter(c => c.id !== id);
      if (this.selectedId === id) {
        this.selectedId = this.customers[0] ? this.customers[0].id : null;
      }
      this.pushAudit('Smazán zákazník ' + name);
      this.toast('Zákazník smazán');
      this.closeModals();
    },

    toggleUser(u) {
      u.active = !u.active;
      this.pushAudit('Uživatel ' + u.name + (u.active ? ' aktivován' : ' deaktivován'));
      this.toast(u.name + (u.active ? ' aktivován' : ' deaktivován'));
    },
    toggleModule(m) {
      m.enabled = !m.enabled;
      this.pushAudit('Modul ' + m.name + (m.enabled ? ' zapnut' : ' vypnut'));
      this.toast(m.name + (m.enabled ? ' zapnut' : ' vypnut'));
    },

    checkSettings() {
      const e = {};
      if (!this.settings.name.trim()) e.name = 'Název je povinný';
      else if (this.settings.name.trim().length < 2) e.name = 'Minimálně 2 znaky';
      const email = this.settings.email.trim();
      if (!email) e.email = 'E-mail je povinný';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = 'Neplatný e-mail';
      return e;
    },
    validateSettings() {
      this.settingsTouched = true;
      this.settingsErrors = this.checkSettings();
      return Object.keys(this.settingsErrors).length === 0;
    },
    saveSettings() {
      if (!this.validateSettings()) {
        this.toast('Opravte chyby v nastavení', 'error');
        return;
      }
      this.pushAudit('Nastavení instance uloženo');
      this.toast('Nastavení uloženo');
    },

    openCommand() {
      this.cmdQuery = '';
      this.cmdIndex = 0;
      this.modal.command = true;
      this.$nextTick(() => this.$refs.cmdInput && this.$refs.cmdInput.focus());
    },
    cmdMove(dir) {
      const len = this.filteredCommands.length;
      if (!len) return;
      this.cmdIndex = (this.cmdIndex + dir + len) % len;
    },
    cmdRun() {
      const item = this.filteredCommands[this.cmdIndex];
      if (item) this.cmdExec(item);
    },
    cmdExec(item) {
      this.closeModals();
      item.action();
    },

    closeModals() {
      this.modal.customer = false;
      this.modal.delete = false;
      this.modal.command = false;
      this.editingCustomer = null;
      this.deleteTarget = null;
    },

    onKey(e) {
      const meta = e.metaKey || e.ctrlKey;
      if (meta && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (this.modal.command) this.closeModals();
        else this.openCommand();
        return;
      }
      if (e.key === 'Escape') {
        if (this.modal.customer || this.modal.delete || this.modal.command) {
          e.preventDefault();
          this.closeModals();
        }
      }
    },
  };
}
</script>
